    <style>.serif{font-family:Georgia,'Times New Roman',serif;fill:#233b32}.caps{font-family:Arial,Helvetica,sans-serif;letter-spacing:4px;font-size:13px;fill:#777d74}.region{font-family:Georgia,'Times New Roman',serif;font-size:27px;font-weight:600;fill:#244034;letter-spacing:2px}.city{font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:600;fill:#233b32}.course{font-family:Arial,Helvetica,sans-serif;font-size:16px;fill:#55645b}.small{font-family:Arial,Helvetica,sans-serif;font-size:12px;fill:#747b74;letter-spacing:2px}.line{stroke:#687a6d;stroke-width:1.5;fill:none;opacity:.75}.goldline{stroke:#a8832f;stroke-width:1.5;fill:none;opacity:.85}.rustline{stroke:#a4512c;stroke-width:1.5;fill:none;opacity:.85}</style>
  </defs>
  <rect width="1200" height="1500" fill="url(#bg)"/>
