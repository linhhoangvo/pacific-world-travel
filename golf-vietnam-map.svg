<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">Golf in Vietnam map</title>
  <desc id="desc">Selected golf regions and signature golf courses across North, Central and South Vietnam.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f2e8"/><stop offset="1" stop-color="#fbf8f2"/></linearGradient>
    <linearGradient id="north" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#637e61"/><stop offset="1" stop-color="#7e986f"/></linearGradient>
    <linearGradient id="central" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a58f4b"/><stop offset="1" stop-color="#b99e58"/></linearGradient>
    <linearGradient id="south" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9f5b35"/><stop offset="1" stop-color="#b36b3e"/></linearGradient>
